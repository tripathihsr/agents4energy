version: 1
backend:
  phases:
    preBuild:
      commands:
        - echo "Build environment is $CODEBUILD_BUILD_IMAGE"
        - echo "Current Node version $(node -v)"
        - nvm install 20
        - nvm use 20
        - echo "Switched to Node version $(node -v)"
        # - aws ecr-public get-login-password | docker login --username AWS --password-stdin public.ecr.aws
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - node_modules/.bin/esbuild --version
        - echo '#!/bin/sh' > /usr/local/bin/docker && echo 'exit 1' >> /usr/local/bin/docker && chmod +x /usr/local/bin/docker
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*